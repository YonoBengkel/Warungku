# Turnify Flow: basis data, API, dan layanan model.
#
# Jalankan dari akar repo.
#
#   Basis data saja (pengembangan; API dan model dijalankan dengan uvicorn):
#     docker compose -f deployment/docker-compose.yml up -d
#
#   Basis data + API (port 8000) + layanan model (port 8001), dari image Docker:
#     docker compose -f deployment/docker-compose.yml --profile layanan up -d
#
# API dan layanan model ada di profil "layanan" supaya perintah pertama tetap
# hanya menyalakan basis data dan tidak bentrok dengan uvicorn lokal di port
# 8000/8001.
#
# Image backend diambil dari Docker Hub (yonobengkel/turnify-flow-backend).
# Kalau belum ada di komputer dan tidak bisa diunduh, Compose membangunnya
# sendiri dari deployment/Dockerfile.
#
# Basis data memakai yonobengkel/turnify-flow-db: PostgreSQL 16 yang berisi data
# simulasi (akun umkm1 Kopi Kita Jogja, distributor1 Sumber Tani Nusantara, dan
# keluaran ketiga mesin). Sejak 0.3.0 isinya salinan basis data Ilham per 27 Okt
# 2026, termasuk variasi demo revisi V4. Data hanya dipulihkan ke volume yang
# masih KOSONG, jadi volume yang sudah berisi data tidak pernah ditimpa;
# siapkan.cmd menawarkan menggantinya bila datanya dari image lama.
#
# Port 5433 (bukan 5432) supaya tidak bentrok dengan PostgreSQL yang mungkin
# sudah berjalan di komputermu.
#
# Nama proyek dikunci "backend". Berkas ini dulu ada di folder backend/, dan
# Docker Compose memakai nama folder sebagai nama proyek. Volume datanya
# bernama backend_warungku_data; tanpa baris ini, Compose akan membuat volume
# baru yang KOSONG dan basis data tampak hilang.
name: backend

x-backend: &backend
  image: yonobengkel/turnify-flow-backend:0.22.0
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &env-backend
    # Di dalam jaringan Compose basis data dicapai lewat nama layanannya, "db",
    # di port aslinya 5432 (5433 hanya port di komputermu).
    WARUNGKU_DB: postgresql+psycopg2://warungku:warungku@db:5432/warungku_dev
    WARUNGKU_ML: http://ml:8001
    # Rahasia token. Isi di deployment/.env (WARUNGKU_RAHASIA=...) supaya login
    # tidak hangus setiap kali kontainer dinyalakan ulang. Kalau kosong, API
    # membuat rahasia acak sendiri: tetap aman, hanya harus login ulang.
    WARUNGKU_RAHASIA: ${WARUNGKU_RAHASIA:-}
    # Awal tautan di QR simulasi Portal POS, mis. http://192.168.1.6:8000, supaya HP di
    # jaringan yang sama bisa membukanya. siapkan.cmd mengisinya dengan alamat Wi-Fi
    # laptop; kontainer tidak bisa melihat alamat itu sendiri. Kosong = tombol cadangan saja.
    WARUNGKU_ALAMAT_QR: ${WARUNGKU_ALAMAT_QR:-}
    # Pameran (docs/PAMERAN.md). Alamat frontend di Vercel, dan kata sandi tim di booth.
    # Mengisi kata sandi ini membuat akun simulasi hanya bisa membaca. Kosong = seperti biasa.
    WARUNGKU_ASAL_TAMBAHAN: ${WARUNGKU_ASAL_TAMBAHAN:-}
    WARUNGKU_SANDI_BOOTH: ${WARUNGKU_SANDI_BOOTH:-}
    TZ: Asia/Jakarta

services:
  db:
    image: yonobengkel/turnify-flow-db:0.3.0
    build:
      context: db
    container_name: warungku-db
    environment:
      POSTGRES_USER: warungku
      POSTGRES_PASSWORD: warungku
      POSTGRES_DB: warungku_dev
      TZ: Asia/Jakarta
    # Hanya untuk komputer ini. Kata sandi basis data ada di repo publik, jadi port ini tidak
    # boleh terbuka ke Wi-Fi yang sama, apalagi di tempat pameran.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warungku_data:/var/lib/postgresql/data
    healthcheck:
      # Lewat TCP (-h 127.0.0.1), bukan soket. Saat volume masih kosong, image
      # memulihkan data lewat server sementara yang hanya membuka soket, lalu
      # menyala ulang. Lewat soket, basis data sudah terbaca sehat selama
      # pemulihan, sehingga API dan langkah variasi demo siapkan.cmd berjalan
      # terlalu cepat dan ditolak saat server sementara dimatikan.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U warungku -d warungku_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Pertama kali dinyalakan, pemulihan data simulasi butuh sekitar satu menit.
      start_period: 180s

  api:
    <<: *backend
    container_name: turnify-api
    profiles: ["layanan"]
    ports:
      - "8000:8000"

  ml:
    <<: *backend
    container_name: turnify-ml
    profiles: ["layanan"]
    # Penjadwal di dalamnya menjalankan Mesin 1 pukul 02.00 WIB serta Mesin 2
    # dan 3 setiap empat jam, lalu menulis hasilnya ke basis data.
    command: ["uvicorn", "ml.layanan:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"

  # Alamat HTTPS sementara untuk API, tanpa domain. Alamatnya berganti tiap kontainer ini
  # dinyalakan ulang: docker logs turnify-tunnel. Langkahnya di docs/PAMERAN.md.
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: turnify-tunnel
    profiles: ["pameran"]
    restart: "no"
    depends_on:
      - api
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]

volumes:
  warungku_data:
