# Basis data pengembangan Warungku.
#
# Port 5433 (bukan 5432) supaya tidak bentrok dengan PostgreSQL yang mungkin
# sudah berjalan di komputermu. Jalankan: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: warungku-db
    environment:
      POSTGRES_USER: warungku
      POSTGRES_PASSWORD: warungku
      POSTGRES_DB: warungku_dev
      TZ: Asia/Jakarta
    ports:
      - "5433:5432"
    volumes:
      - warungku_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warungku -d warungku_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warungku_data:
